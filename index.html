<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GAME ON — Nagrada ili Kazna</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05020b;color:#fff;font-family:Arial,Helvetica,sans-serif}
.viewport{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#05020b}
.canvas{position:relative;width:min(100vw,177.7778dvh);height:min(100dvh,56.25vw);aspect-ratio:16/9;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;pointer-events:none}
#board{position:absolute;inset:0;z-index:2}
.hotspot{position:absolute;border:0;background:transparent;padding:0;margin:0;border-radius:1.2%;appearance:none;-webkit-appearance:none;outline:none;cursor:pointer;z-index:2}
.hotspot:hover{filter:brightness(1.08)}
.hotspot.opened{cursor:default;pointer-events:none}
.hotspot.opened:after{content:"";position:absolute;inset:0;border-radius:1.2%;background:rgba(5,1,12,.88);box-shadow:inset 0 0 35px rgba(160,50,255,.55),0 0 16px rgba(255,111,25,.25);border:2px solid rgba(255,255,255,.12)}
#newgame{position:absolute;left:38.5%;top:81.0%;width:23%;height:9.5%;z-index:3;border:0;background:transparent;border-radius:999px;cursor:pointer}
#newgame:hover{filter:brightness(1.12)}
/* Exact 10 field hit zones, aligned to the supplied 1536x864 artwork. */
#h1{left:19.77%;top:36.97%;width:11.30%;height:19.34%}
#h2{left:31.73%;top:36.97%;width:11.30%;height:19.34%}
#h3{left:43.75%;top:36.97%;width:11.36%;height:19.34%}
#h4{left:55.95%;top:36.97%;width:11.30%;height:19.34%}
#h5{left:68.00%;top:36.97%;width:11.36%;height:19.34%}
#h6{left:19.77%;top:57.91%;width:11.30%;height:19.44%}
#h7{left:31.73%;top:57.91%;width:11.30%;height:19.44%}
#h8{left:43.75%;top:57.91%;width:11.36%;height:19.44%}
#h9{left:55.95%;top:57.91%;width:11.30%;height:19.44%}
#h10{left:68.00%;top:57.91%;width:11.36%;height:19.44%}
/* reveal */
#overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,rgba(122,25,180,.35),transparent 42%),rgba(3,1,8,.72);backdrop-filter:blur(4px)}
#overlay.show{display:flex}
.card{width:min(900px,86vw);min-height:440px;border:2px solid #b84cff;border-radius:28px;background:linear-gradient(145deg,rgba(24,4,47,.97),rgba(8,3,18,.98) 55%,rgba(60,15,4,.96));box-shadow:0 0 28px #b84cffaa,0 0 70px #ff711955,inset 0 0 55px #8a2cff22;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:38px 44px;text-align:center;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,126,28,.65);border-radius:20px;pointer-events:none}
.brand{font-size:clamp(16px,2vw,28px);font-weight:900;letter-spacing:.32em;margin-bottom:16px;color:#fff}.brand b{color:#ff8a1f}
.badge{border:1px solid #b84cff;border-radius:999px;padding:10px 20px;font-weight:900;letter-spacing:.15em;font-size:clamp(11px,1.2vw,16px)}
.big{font-size:clamp(54px,7vw,108px);font-weight:1000;line-height:.95;margin:25px 0 12px;text-transform:uppercase;text-shadow:0 0 18px currentColor,0 5px 0 #1a061e}
.details{max-width:760px;font-size:clamp(18px,2vw,30px);font-weight:800;line-height:1.25;min-height:76px;display:flex;align-items:center;justify-content:center}
.type{margin-top:10px;font-size:clamp(14px,1.5vw,20px);letter-spacing:.18em;font-weight:900;color:#ffb15f}
.close{margin-top:28px;border:2px solid #ff8a1f;background:#0b0614;color:#fff;border-radius:999px;padding:13px 34px;font-weight:900;letter-spacing:.08em;cursor:pointer;font-size:16px}.close:hover{filter:brightness(1.2)}
.nagrada .big{color:#ff9a28}.kazna .big{color:#c56cff}
@media(max-width:700px){.card{min-height:350px;padding:25px 20px}.brand{letter-spacing:.18em}.close{margin-top:20px}.details{font-size:19px}}
</style>
</head>
<body>
<div class="viewport"><div class="canvas">
<img class="bg" src="gameon-background.jpg" alt="">
<div id="board"></div>
<button id="newgame" aria-label="Nova igra"></button>
</div></div>
<div id="overlay">
  <div class="card">
    <div class="brand">GAME <b>ON</b></div>
    <div class="badge">IZABRANO POLJE</div>
    <div class="big" id="bigResult"></div>
    <div class="details" id="resultDetails"></div>
    <div class="type" id="resultType"></div>
    <button class="close" onclick="closeOverlay()">ZATVORI</button>
  </div>
</div>
<script>
const board=document.getElementById('board'), overlay=document.getElementById('overlay');
const positions=[[19.77,36.97,11.30,19.34],[31.73,36.97,11.30,19.34],[43.75,36.97,11.36,19.34],[55.95,36.97,11.30,19.34],[68.00,36.97,11.36,19.34],[19.77,57.91,11.30,19.44],[31.73,57.91,11.30,19.44],[43.75,57.91,11.36,19.44],[55.95,57.91,11.30,19.44],[68.00,57.91,11.36,19.44]];
const rewards=[
 ['NAGRADA','1 vrećica gratis','BONUS'],
 ['NAGRADA','Dupli poeni — jedno bacanje se računa ×2','BONUS'],
 ['NAGRADA','Bonus polje','BONUS'],
 ['NAGRADA','+15 sekundi','BONUS'],
 ['NAGRADA','Blizina — igrač se spušta 3 m','BONUS']
];
const penalties=[
 ['KAZNA','1 vrećica manje','KAZNA'],
 ['KAZNA','Slabija ruka — igrač gađa slabijom rukom','KAZNA'],
 ['KAZNA','RIZIK — igrač bira polje. Ako pogodi dobija poene, ako promaši oduzimaju mu se poeni','KAZNA'],
 ['KAZNA','DALJINA — igrač se pomera 3 m u vis','KAZNA'],
 ['KAZNA','-15 sekundi','KAZNA']
];
let results=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){
 results=shuffle([...rewards.map(x=>({kind:x[0],text:x[1],type:x[2]})),...penalties.map(x=>({kind:x[0],text:x[1],type:x[2]}))]);
 board.innerHTML='';
 positions.forEach((p,i)=>{const b=document.createElement('button');b.className='hotspot';b.id='h'+(i+1);b.style.left=p[0]+'%';b.style.top=p[1]+'%';b.style.width=p[2]+'%';b.style.height=p[3]+'%';b.setAttribute('aria-label','Polje '+(i+1));b.onclick=()=>openTile(b,i);board.appendChild(b)});
 closeOverlay();
}
function openTile(b,i){if(b.classList.contains('opened'))return;b.classList.add('opened');const r=results[i];document.getElementById('bigResult').textContent=r.kind;document.getElementById('resultDetails').textContent=r.text;document.getElementById('resultType').textContent=r.type;overlay.className='show '+(r.kind==='NAGRADA'?'nagrada':'kazna')}
function closeOverlay(){overlay.className=''}
document.getElementById('newgame').onclick=newGame;overlay.addEventListener('click',e=>{if(e.target===overlay)closeOverlay()});document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')newGame();if(e.key==='Escape')closeOverlay()});newGame();
</script>
</body></html>
