<!doctype html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAME ON Challenge</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07020d}
body{font-family:Arial,Helvetica,sans-serif}
.game{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;background:url("gameon-bg.png") center/cover no-repeat}
.board{position:relative;z-index:2;width:min(72vw,920px);display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.card{aspect-ratio:1.15/1;border:3px solid #a63cff;border-radius:20px;background:linear-gradient(135deg,#18003b,#090015);box-shadow:0 0 14px #922dff,inset 0 0 32px #3e0872;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.card:nth-child(even){border-color:#ff6b16;background:linear-gradient(135deg,#391000,#120400);box-shadow:0 0 14px #ff5b0a,inset 0 0 32px #6f2100}
.card:hover{transform:scale(1.025)}
.card.open{filter:brightness(.65);cursor:default;transform:none}
.num{font-size:clamp(44px,5vw,76px);font-weight:900;font-style:italic;text-shadow:3px 4px 0 #28222e}
.card.open .num{visibility:hidden}
.new{position:absolute;z-index:3;bottom:5vh;left:50%;transform:translateX(-50%);border:3px solid #ff6415;border-radius:40px;background:#11001f;color:white;padding:14px 38px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 0 15px #a52cff,0 0 18px #ff5b0a}
@media(max-width:900px){.board{width:84vw;gap:10px}.card{border-width:2px;border-radius:14px}.new{font-size:16px;padding:10px 26px}}
</style>
</head>
<body>
<div class="game">
<div class="bg"></div>
<div class="board" id="board"></div>
<button class="new" id="newGame">↝ &nbsp; NOVA IGRA</button>
</div>
<script>
const board=document.getElementById("board");
function start(){
 board.innerHTML="";
 for(let i=1;i<=10;i++){
  const c=document.createElement("button");
  c.className="card";
  c.innerHTML='<span class="num">'+i+"</span>";
  c.onclick=()=>c.classList.add("open");
  board.appendChild(c);
 }
}
document.getElementById("newGame").onclick=start;
start();
</script>
</body>
</html>
